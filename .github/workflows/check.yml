name: Check release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s agent -p 'test_*.py'
      - run: python -m unittest discover -s tests -p '*.py'
      - run: python scripts/build_release.py
      - run: python tests/test_release_safety.py --scan .
      - run: python tests/test_release_safety.py --scan dist/mini-codex-magisk-2.0.0.zip
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
  release:
    needs: [python, relay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mini-codex-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - run: python tests/test_release_safety.py --scan dist/mini-codex-magisk-2.0.0.zip
      - name: Publish verified Mini Codex 2.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'Existing v2.0.0 release retained.'
          else
            gh release create v2.0.0 dist/mini-codex-magisk-2.0.0.zip dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title 'Mini Codex 2.0' --notes-file CHANGELOG.md
          fi
